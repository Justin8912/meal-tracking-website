# nginx config for the SPA (AD-5).
#
# - SPA history fallback: client-side routes (e.g. /library, /planner) resolve to
#   index.html instead of 404ing, so deep links and refreshes work.
# - env-config.js is served no-cache so a stale copy never pins an old API URL
#   (a listed risk). The hashed asset bundle is cached normally.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Runtime config must never be cached (AD-5 risk mitigation).
    location = /env-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires -1;
        try_files /env-config.js =404;
    }

    # Hashed, immutable build assets can be cached aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: serve index.html for any unmatched route.
    # index.html must never be cached — it references hashed bundle filenames
    # and a stale copy would keep serving the old app after a deploy.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
